<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kennach</title></head>
<body style="font-family:-apple-system,Segoe UI,sans-serif;background:#000;color:#fff;display:grid;place-items:center;height:100vh;margin:0"><p>Connexion…</p>
<script>
var q=location.search||location.hash.replace(/^#/,"?");
try{if(window.opener&&!window.opener.closed){window.opener.postMessage({kauth:q},location.origin);setTimeout(function(){window.close()},150)}else{localStorage.setItem("kauth_result",q);location.replace("./")}}catch(e){localStorage.setItem("kauth_result",q);location.replace("./")}
</script></body></html>
